<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSTK 관제 센터 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        #mainDashboard { display: none; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .scroll-list { max-height: 120px; overflow-y: auto; font-size: 12px; }
        .scroll-list::-webkit-scrollbar { width: 4px; }
        .scroll-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .rank-number { font-style: italic; font-weight: 900; color: #cbd5e1; }
    </style>
</head>
<body class="text-slate-800">

    <div id="loginOverlay" class="fixed inset-0 bg-slate-900 z-[9999] flex items-center justify-center p-6">
        <div class="w-full max-w-xs text-center">
            <h1 class="text-white text-3xl font-black mb-10 tracking-tighter">BSTK <span class="text-blue-500">ADMIN</span></h1>
            <input type="password" id="pwInput" placeholder="PIN" maxlength="4"
                   class="w-full bg-slate-800 border-none rounded-2xl text-white text-4xl text-center mb-6 py-5 focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="checkPassword()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-lg">시스템 접속</button>
        </div>
    </div>

    <div id="mainDashboard" class="p-4 max-w-4xl mx-auto space-y-4">
        <header class="flex justify-between items-center py-2">
            <div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">관제 센터 <span class="text-blue-600">LIVE</span></h2>
                <p id="updateTime" class="text-[10px] font-bold text-slate-400">데이터 수신 대기 중...</p>
            </div>
            <div id="activeCountBadge" class="bg-blue-600 text-white px-4 py-2 rounded-2xl font-black text-sm shadow-md animate-pulse">0명 접속 중</div>
        </header>

        <section class="glass-card p-5 border-l-4 border-l-blue-600">
            <h3 class="font-bold text-xs text-slate-400 mb-4 uppercase tracking-widest">Active Users</h3>
            <div id="userList" class="flex flex-wrap gap-2 min-h-[40px]"></div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-xs text-slate-400 uppercase tracking-widest">Today's Access</h3>
                    <span id="todayCount" class="text-lg font-black text-blue-600">0</span>
                </div>
                <div id="todayUserList" class="scroll-list space-y-2 pr-2"></div>
            </div>

            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-xs text-slate-400 uppercase tracking-widest">Weekly Access</h3>
                    <span id="weekCount" class="text-lg font-black text-indigo-600">0</span>
                </div>
                <div id="weekUserList" class="scroll-list space-y-2 pr-2"></div>
            </div>
        </div>

        <section class="glass-card p-5">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h3 class="font-bold text-xs text-slate-400 uppercase tracking-widest mb-1">24H Traffic Comparison</h3>
                    <p class="text-[10px] text-slate-400">실시간 오늘 데이터와 과거 평균 데이터 비교</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Peak Hour</p>
                    <p id="peakHourText" class="text-lg font-black text-red-500">--시</p>
                </div>
            </div>
            <div class="h-40 w-full"><canvas id="trafficChart"></canvas></div>
        </section>

        <section class="glass-card p-5">
            <h3 class="font-bold text-xs text-slate-400 mb-5 uppercase tracking-widest">Overall Access Ranking (Top 10)</h3>
            <div id="rankingList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </section>

        <section class="glass-card p-5 flex flex-col items-center">
            <h3 class="font-bold text-xs text-slate-400 mb-6 uppercase tracking-widest w-full text-center">Device Engagement</h3>
            <div class="w-full flex justify-around items-center">
                <div class="w-28 h-28 relative"><canvas id="deviceChart"></canvas></div>
                <div class="space-y-4">
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-slate-400">PC 사용</p>
                        <p id="pcRatio" class="text-xl font-black text-blue-600">0%</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-slate-400">모바일 사용</p>
                        <p id="mobRatio" class="text-xl font-black text-purple-600">0%</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ✅ 새로 발급받은 URL 적용
        const API_URL = "https://script.google.com/macros/s/AKfycbyyw7IOCeHeilh8U2i86gSoVRQgytexeqS5wDd1R0UX_BbRSENErqpIwXkdzjh6qooU/exec";
        const ADMIN_PW = "1541";
        
        function checkPassword() {
            if(document.getElementById('pwInput').value === ADMIN_PW) {
                document.getElementById('loginOverlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainDashboard').style.display = 'block';
                    initCharts(); updateDashboard();
                    setInterval(updateDashboard, 30000);
                }, 300);
            } else {
                alert("비밀번호가 틀렸습니다.");
                document.getElementById('pwInput').value = '';
            }
        }

        let trafficChart, deviceChart;

        function initCharts() {
            const ctxT = document.getElementById('trafficChart').getContext('2d');
            trafficChart = new Chart(ctxT, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => i + '시'),
                    datasets: [
                        { label: '오늘', data: Array(24).fill(0), borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0 },
                        { label: '평균', data: Array(24).fill(0), borderColor: '#cbd5e1', borderDash: [5, 5], fill: false, tension: 0.4, borderWidth: 2, pointRadius: 0 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 9 } } }, y: { display: false } } }
            });

            const ctxD = document.getElementById('deviceChart').getContext('2d');
            deviceChart = new Chart(ctxD, {
                type: 'doughnut',
                data: { labels: ['PC', 'Mobile'], datasets: [{ data: [1, 1], backgroundColor: ['#3b82f6', '#a855f7'], borderWidth: 0, cutout: '80%' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        async function updateDashboard() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                document.getElementById("updateTime").innerText = "마지막 동기화: " + new Date().toLocaleTimeString();
                document.getElementById("activeCountBadge").innerText = data.activeCount + "명 접속 중";
                document.getElementById("todayCount").innerText = data.daily.count + "회";
                document.getElementById("weekCount").innerText = data.weekly.count + "회";

                const userList = document.getElementById("userList");
                userList.innerHTML = data.activeList.length ? "" : '<p class="text-slate-300 text-xs italic">현재 접속자 없음</p>';
                data.activeList.forEach(u => {
                    userList.innerHTML += `<span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full font-bold border border-blue-100 flex items-center gap-2 text-xs"><span class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-pulse"></span> ${u.name}</span>`;
                });

                const todayList = document.getElementById("todayUserList");
                todayList.innerHTML = data.daily.users?.length ? data.daily.users.map(u => `<div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg"><span class="font-bold text-slate-700">${u}님</span><span class="text-[9px] text-slate-400 font-bold">TODAY</span></div>`).join('') : '<p class="text-slate-300 text-center py-4 text-xs">오늘 접속 기록 없음</p>';

                const weekList = document.getElementById("weekUserList");
                weekList.innerHTML = data.weekly.users?.length ? data.weekly.users.map(u => `<div class="flex justify-between items-center p-2 bg-indigo-50/50 rounded-lg"><span class="font-bold text-slate-700">${u}님</span><span class="text-[9px] text-indigo-400 font-bold">WEEKLY</span></div>`).join('') : '<p class="text-slate-300 text-center py-4 text-xs">주간 접속 기록 없음</p>';

                trafficChart.data.datasets[0].data = data.hourlyTraffic;
                trafficChart.data.datasets[1].data = data.hourlyAverage;
                trafficChart.update();

                const peakIdx = data.hourlyAverage.indexOf(Math.max(...data.hourlyAverage));
                document.getElementById("peakHourText").innerText = peakIdx + "시";

                const rankList = document.getElementById("rankingList");
                rankList.innerHTML = "";
                data.ranking.slice(0, 10).forEach((u, i) => {
                    rankList.innerHTML += `<div class="flex items-center justify-between p-3 border-b border-slate-50"><div class="flex items-center gap-3"><span class="rank-number text-lg w-6">${i+1}</span><span class="font-bold text-slate-700 text-sm">${u.name}님</span></div><span class="font-black text-blue-600 text-sm">${u.count.toLocaleString()}회</span></div>`;
                });

                const total = data.total.count || 1;
                const pcP = Math.round((data.total.pc / total) * 100);
                deviceChart.data.datasets[0].data = [data.total.pc, data.total.mobile];
                deviceChart.update();
                document.getElementById("pcRatio").innerText = pcP + "%";
                document.getElementById("mobRatio").innerText = (100 - pcP) + "%";

            } catch (e) { console.error("Update Error", e); }
        }
    </script>
</body>
</html>
