<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSTK 관제 센터 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .scroll-list { max-height: 140px; overflow-y: auto; font-size: 11px; }
        .scroll-list::-webkit-scrollbar { width: 3px; }
        .scroll-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        /* 모달 팝업 스타일 */
        #detailModal { display: none; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="text-slate-800">

    <div id="loginOverlay" class="fixed inset-0 bg-slate-900 z-[9999] flex items-center justify-center p-6">
        <div class="w-full max-w-xs text-center">
            <h1 class="text-white text-3xl font-black mb-10 italic tracking-tighter">BSTK ADMIN</h1>
            <input type="password" id="pwInput" placeholder="PIN" maxlength="4" class="w-full bg-slate-800 border-none rounded-2xl text-white text-4xl text-center mb-6 py-5 focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="checkPassword()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-lg">시스템 접속</button>
        </div>
    </div>

    <div id="mainDashboard" class="p-4 max-w-5xl mx-auto space-y-4" style="display: none;">
        <header class="flex justify-between items-end py-2">
            <div>
                <h2 class="text-xl font-black text-slate-900 tracking-tight">BSTK 관제 시스템</h2>
                <div id="activeCountBadge" class="inline-block bg-blue-600 text-white px-3 py-1 rounded-lg font-black text-[10px] shadow-sm animate-pulse mt-1">0명 접속 중</div>
            </div>
            <div class="text-right flex flex-col items-end">
                <p id="updateTime" class="text-[9px] font-bold text-slate-400 mb-1.5 uppercase">SYNCING DATA...</p>
                <div class="w-24 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                    <div id="progress" class="h-full bg-blue-600 w-0 transition-all duration-[30000ms] ease-linear"></div>
                </div>
            </div>
        </header>

        <section class="glass-card p-4 border-l-4 border-l-blue-600 overflow-x-auto">
            <h3 class="font-bold text-[10px] text-slate-400 mb-2 uppercase tracking-widest">Active Users (Real-time)</h3>
            <div id="userList" class="flex gap-2 min-h-[30px] custom-scrollbar"></div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-xs text-slate-400 uppercase tracking-widest">Today's Access</h3>
                    <span id="todayCount" class="text-xl font-black text-blue-600">0회</span>
                </div>
                <div id="todayUserList" class="scroll-list space-y-2 border-t pt-3"></div>
            </div>

            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-xs text-slate-400 uppercase tracking-widest">Weekly Distribution</h3>
                    <span id="weekCount" class="text-xl font-black text-indigo-600">0회</span>
                </div>
                <div class="h-32 w-full"><canvas id="weekChart"></canvas></div>
                <p class="text-[9px] text-slate-400 mt-2 text-center italic">* 막대를 누르면 상세 인원이 표시됩니다.</p>
            </div>

            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-xs text-slate-400 uppercase tracking-widest">Monthly Trend</h3>
                    <span id="monthCount" class="text-xl font-black text-emerald-600">0회</span>
                </div>
                <div class="h-32 w-full"><canvas id="monthChart"></canvas></div>
                <p class="text-[9px] text-slate-400 mt-2 text-center italic">* 날짜를 누르면 상세 인원이 표시됩니다.</p>
            </div>

            <div class="glass-card p-5">
                <h3 class="font-bold text-xs text-slate-400 mb-4 uppercase tracking-widest">User Ranking</h3>
                <div id="rankingList" class="scroll-list space-y-1"></div>
            </div>
        </div>

        <section class="glass-card p-5">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="font-bold text-[10px] text-slate-400 uppercase tracking-widest">24H Traffic Comparison</h3>
                    <p class="text-[9px] text-slate-400 mt-0.5">오늘 실시간 vs 과거 시간대별 평균</p>
                </div>
                <p id="peakHourText" class="text-xs font-black text-red-500">Peak: --시</p>
            </div>
            <div class="h-40 w-full"><canvas id="trafficChart"></canvas></div>
        </section>

        <section class="glass-card p-5 flex items-center justify-around">
            <div class="w-24 h-24 relative"><canvas id="deviceChart"></canvas></div>
            <div class="flex gap-8 text-right">
                <div><p class="text-[10px] font-bold text-slate-400 uppercase">PC</p><p id="pcRatio" class="text-xl font-black text-blue-600">0%</p></div>
                <div><p class="text-[10px] font-bold text-slate-400 uppercase">MOB</p><p id="mobRatio" class="text-xl font-black text-purple-600">0%</p></div>
            </div>
        </section>
    </div>

    <div id="detailModal" class="fixed inset-0 z-[10000] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h4 id="modalTitle" class="font-black text-slate-800 tracking-tight">상세 접속자</h4>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="modalContent" class="p-6 max-h-[60vh] overflow-y-auto space-y-3"></div>
            <div class="p-4 bg-slate-50 text-center">
                <button onclick="closeModal()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw1ltj9IOtwUzZSaY2sVNELp9NDlNEHf1YduPOTAgc5e0VP8qqwEBq1LQz9xZqfnVWj/exec";
        const ADMIN_PW = "1541";
        let rawData = null;

        // ✅ 엔터키 지원 부활!
        document.getElementById('pwInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        function checkPassword() {
            if(document.getElementById('pwInput').value === ADMIN_PW) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                initCharts(); 
                updateDashboard();
                setInterval(updateDashboard, 30000);
            } else { 
                alert("비밀번호 오류"); 
                document.getElementById('pwInput').value = ''; 
            }
        }

        // 모달 팝업 컨트롤
        function openModal(title, usersObj) {
            document.getElementById('modalTitle').innerText = title + " 상세 인원";
            const content = document.getElementById('modalContent');
            content.innerHTML = "";
            
            if(!usersObj || Object.keys(usersObj).length === 0) {
                content.innerHTML = "<p class='text-center text-slate-400 py-10 italic'>접속 기록이 없습니다.</p>";
            } else {
                Object.entries(usersObj).sort((a,b)=>b[1]-a[1]).forEach(([name, count]) => {
                    content.innerHTML += `
                        <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="font-bold text-slate-700">${name}님</span>
                            <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-lg font-black text-[10px]">${count}회</span>
                        </div>`;
                });
            }
            document.getElementById('detailModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

        let trafficChart, deviceChart, weekChart, monthChart;

        function initCharts() {
            const chartOpt = {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                onClick: (e, elements, chart) => {
                    if (elements.length > 0 && rawData) {
                        const index = elements[0].index;
                        const label = chart.data.labels[index];
                        const type = chart.canvas.id === 'weekChart' ? 'weekly' : 'monthly';
                        if(rawData[type] && rawData[type].details) {
                            openModal(label, rawData[type].details[label]);
                        }
                    }
                },
                scales: { x: { grid: { display: false }, ticks: { font: { size: 10, weight: 'bold' } } }, y: { display: false } }
            };

            trafficChart = new Chart(document.getElementById('trafficChart'), {
                type: 'line',
                data: { labels: Array.from({length: 24}, (_, i) => i + '시'), datasets: [
                    { label: '오늘', data: Array(24).fill(0), borderColor: '#3b82f6', fill: true, backgroundColor: 'rgba(59, 130, 246, 0.05)', tension: 0.4, borderWidth: 3, pointRadius: 0 },
                    { label: '평균', data: Array(24).fill(0), borderColor: '#cbd5e1', borderDash: [5, 5], fill: false, tension: 0.4, borderWidth: 1.5, pointRadius: 0 }
                ]},
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 10, font: { size: 9 } } } }, scales: { x: { display: true, grid: { display: false } }, y: { display: false } } }
            });

            weekChart = new Chart(document.getElementById('weekChart'), {
                type: 'bar',
                data: { labels: ['월','화','수','목','금','토','일'], datasets: [{ data: Array(7).fill(0), backgroundColor: '#6366f1', borderRadius: 6 }] },
                options: chartOpt
            });

            monthChart = new Chart(document.getElementById('monthChart'), {
                type: 'bar',
                data: { labels: Array.from({length: 31}, (_, i) => (i + 1).toString()), datasets: [{ data: Array(31).fill(0), backgroundColor: '#10b981', borderRadius: 4 }] },
                options: chartOpt
            });

            deviceChart = new Chart(document.getElementById('deviceChart'), { type: 'doughnut', data: { labels: ['PC','Mob'], datasets: [{ data: [1,1], backgroundColor: ['#3b82f6','#a855f7'], borderWidth: 0, cutout: '80%' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '80%' } });
        }

        async function updateDashboard() {
            const bar = document.getElementById("progress");
            bar.style.transition = 'none'; bar.style.width = "0%";
            setTimeout(() => { bar.style.transition = 'width 30000ms linear'; bar.style.width = "100%"; }, 100);

            try {
                const res = await fetch(API_URL);
                rawData = await res.json();

                document.getElementById("updateTime").innerText = "최종 갱신: " + new Date().toLocaleTimeString();
                document.getElementById("activeCountBadge").innerText = (rawData.activeCount || 0) + "명 접속 중";
                document.getElementById("todayCount").innerText = (rawData.daily?.count || 0) + "회";
                document.getElementById("weekCount").innerText = (rawData.weekly?.count || 0) + "회";
                document.getElementById("monthCount").innerText = (rawData.monthly?.count || 0) + "회";

                // 실시간 리스트
                const uList = document.getElementById("userList");
                uList.innerHTML = rawData.activeList?.length ? "" : '<span class="text-slate-300 text-[11px] italic">접속자 없음</span>';
                rawData.activeList?.forEach(u => {
                    uList.innerHTML += `<span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-xl font-bold border border-blue-100 flex-shrink-0 text-[10px]"><span class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-pulse inline-block mr-1"></span> ${u.name}</span>`;
                });

                // 오늘 리스트
                const tList = document.getElementById("todayUserList");
                tList.innerHTML = rawData.daily?.users?.length ? rawData.daily.users.map(u => `<div class="flex justify-between p-2 bg-slate-50 rounded-lg border border-slate-100 font-bold mb-1"><span class="text-slate-700">${u}님</span><span class="text-[9px] text-blue-500 uppercase font-black">Today</span></div>`).join('') : '<p class="text-center py-4 text-slate-300 text-[10px]">기록 없음</p>';

                // 🚨 버그 완벽 수정 (랭킹 리스트) 🚨
                const rList = document.getElementById("rankingList");
                rList.innerHTML = rawData.ranking?.length ? rawData.ranking.map((u, i) => `<div class="flex justify-between items-center text-[11px] border-b border-slate-50 py-2"><div class="flex gap-3"><span class="rank-number w-4">${i+1}</span><span class="font-bold text-slate-700">${u.name}님</span></div><span class="font-black text-blue-600">${u.count}회</span></div>`).join('') : '<p class="text-slate-300 text-[10px] mt-2">기록 없음</p>';

                // 차트 데이터 주입
                trafficChart.data.datasets[0].data = rawData.hourlyTraffic || Array(24).fill(0);
                trafficChart.data.datasets[1].data = rawData.hourlyAverage || Array(24).fill(0);
                trafficChart.update();
                
                weekChart.data.datasets[0].data = rawData.weekly?.dayDist || Array(7).fill(0); weekChart.update();
                monthChart.data.datasets[0].data = rawData.monthly?.dateDist ? rawData.monthly.dateDist.slice(1) : Array(31).fill(0); monthChart.update();

                // 피크 타임 계산
                let peakIdx = -1;
                if(rawData.hourlyAverage && rawData.hourlyAverage.length > 0) {
                    peakIdx = rawData.hourlyAverage.indexOf(Math.max(...rawData.hourlyAverage));
                }
                document.getElementById("peakHourText").innerText = peakIdx >= 0 ? "Peak: " + peakIdx + "시" : "Peak: --시";

                // 기기 비중 계산
                const total = rawData.total?.count || 1;
                const pcP = Math.round(((rawData.total?.pc || 0) / total) * 100);
                deviceChart.data.datasets[0].data = [rawData.total?.pc || 0, rawData.total?.mobile || 0]; deviceChart.update();
                document.getElementById("pcRatio").innerText = pcP + "%";
                document.getElementById("mobRatio").innerText = (100 - pcP) + "%";

            } catch (e) { console.error("데이터 렌더링 오류:", e); }
        }
    </script>
</body>
</html>
